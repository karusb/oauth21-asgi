name: CI
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      build_distribution:
        description: 'Build and test a wheel; releases build tagged source once in the release job'
        type: boolean
        default: true
  schedule:
    - cron: '23 5 * * 1'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  security:
    name: Trivy security gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install checksum-pinned Trivy 0.75.0
        run: |
          curl --fail --silent --show-error --location --retry 3 https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz --output "$RUNNER_TEMP/trivy.tar.gz"
          echo "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f  $RUNNER_TEMP/trivy.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/trivy"
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP/trivy" trivy
          echo "$RUNNER_TEMP/trivy" >> "$GITHUB_PATH"
      - name: Resolve runtime, optional and development dependencies
        run: |
          python -m pip install --disable-pip-version-check '.[dev,example,cimd]'
          python -m pip check
          mkdir -p artifacts/security-scan
          python -m pip freeze --exclude oauth21-asgi > artifacts/security-scan/requirements.txt
      - name: Scan resolved dependencies
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: |
          trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --ignorefile /dev/null --timeout 10m artifacts/security-scan/requirements.txt
      - name: Scan source for secrets and misconfiguration
        if: ${{ !cancelled() }}
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: |
          trivy fs --scanners secret,misconfig --severity HIGH,CRITICAL --exit-code 1 --ignorefile /dev/null --timeout 10m --skip-dirs .git --skip-dirs .tools --skip-dirs artifacts --skip-dirs '.venv*' --skip-dirs dist --skip-dirs build .
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --disable-pip-version-check -e '.[fastapi,cimd]' 'pytest>=8.4,<10' 'pytest-cov>=7,<8' 'httpx2>=2.13.1,<3'
      - run: python -m pip check
      - run: python -m pytest --cov --cov-report=term-missing
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python -m pip install -e '.[dev,example]'
      - run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy src
          python -m bandit -q -r src
          python -m pip_audit
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        profile: [minimum, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - if: matrix.profile == 'minimum'
        run: python -m pip install -e '.[fastapi,cimd]' 'Authlib==1.8.0' 'starlette==1.7.0' 'fastapi==0.142.2' 'python-multipart==0.0.32' 'aiohttp==3.14.4' 'pytest>=8.4,<10' 'pytest-cov>=7,<8' 'httpx2>=2.13.1,<3'
      - if: matrix.profile == 'latest'
        run: python -m pip install --upgrade -e '.[fastapi,cimd]' 'pytest>=8.4,<10' 'pytest-cov>=7,<8' 'httpx2>=2.13.1,<3'
      - run: python -m pip check
      - run: python -m pytest --cov --cov-report=term-missing
  distribution:
    if: toJSON(inputs.build_distribution) != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python -m pip install -e '.[dev,example]'
      - run: |
          python -m build
          python scripts/publication_gate.py
          python -m twine check --strict dist/*
          python scripts/check_distribution.py dist
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install --disable-pip-version-check dist/*.whl 'fastapi>=0.142.2,<1' 'itsdangerous>=2.2,<3' 'httpx2>=2.13.1,<3'
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-smoke/bin/python" "$GITHUB_WORKSPACE/scripts/wheel_smoke.py" "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: distributions-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          retention-days: 1
          if-no-files-found: error
  e2e:
    needs: distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        layer: [tcp, https, mcp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: distributions-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          digest-mismatch: error
      - run: python -m pip install 'httpx2>=2.13.1,<3' 'cryptography>=50,<51'
      - if: matrix.layer != 'tcp'
        name: Install checksum-pinned Caddy 2.11.7
        run: |
          curl --fail --silent --show-error --location https://github.com/caddyserver/caddy/releases/download/v2.11.7/caddy_2.11.7_linux_amd64.tar.gz --output "$RUNNER_TEMP/caddy.tar.gz"
          echo "727b91701a392de6ebc5027509f548bf39979e5216340d0faed8fa5e69c84f8b  $RUNNER_TEMP/caddy.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/caddy"
          tar -xzf "$RUNNER_TEMP/caddy.tar.gz" -C "$RUNNER_TEMP/caddy"
          echo "CADDY_BINARY=$RUNNER_TEMP/caddy/caddy" >> "$GITHUB_ENV"
      - if: matrix.layer == 'tcp'
        run: python scripts/e2e.py dist/*.whl
      - if: matrix.layer == 'https'
        run: python scripts/e2e.py dist/*.whl --https
      - if: matrix.layer == 'mcp'
        name: MCP interoperability (official Python SDK 2.3.0)
        run: python scripts/e2e.py dist/*.whl --https --mcp
