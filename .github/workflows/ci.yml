name: CI
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - if: matrix.python != '3.14'
        run: python -m pip install --disable-pip-version-check -e '.[fastapi]' 'pytest>=8.4,<10' 'pytest-cov>=7,<8' 'httpx2>=2.13.1,<3'
      - if: matrix.python == '3.14'
        run: python -m pip install --disable-pip-version-check -e '.[dev,example]'
      - run: python -m pip check
      - run: python -m pytest --cov --cov-report=term-missing
      - if: matrix.python == '3.14'
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy src
          python -m bandit -q -r src
          python -m pip_audit
      - if: matrix.python == '3.14'
        run: |
          python -m build
          python -m twine check --strict dist/*
          python scripts/check_distribution.py dist
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install --disable-pip-version-check dist/*.whl 'fastapi>=0.142.2,<1' 'itsdangerous>=2.2,<3' 'httpx2>=2.13.1,<3'
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-smoke/bin/python" "$GITHUB_WORKSPACE/scripts/wheel_smoke.py" "$GITHUB_WORKSPACE"
  # No retained artifacts on ordinary CI. Release artifacts are tiny and attached to the release.
