name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to publish to PyPI (for example v0.1.1); leave empty for normal release automation'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    with:
      build_distribution: false
  release:
    needs: checks
    if: github.ref == 'refs/heads/main' && inputs.release_tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.release.outputs.release_created == 'true'
        with:
          ref: ${{ steps.release.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.release.outputs.release_created == 'true'
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Validate tagged source and distributions
        if: steps.release.outputs.release_created == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          python -m pip install --disable-pip-version-check '.[dev,example]'
          python -m pip check
          python -m pytest --cov --cov-report=term-missing
          python -m pip_audit
          python -m build
          python -m twine check --strict dist/*
          python scripts/check_distribution.py dist
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS)
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install --disable-pip-version-check dist/*.whl 'fastapi>=0.142.2,<1' 'itsdangerous>=2.2,<3' 'httpx2>=2.13.1,<3'
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-smoke/bin/python" "$GITHUB_WORKSPACE/scripts/wheel_smoke.py" "$GITHUB_WORKSPACE"
      - name: Test exact tagged wheel over TCP, HTTPS and MCP
        if: steps.release.outputs.release_created == 'true'
        run: |
          curl --fail --silent --show-error --location https://github.com/caddyserver/caddy/releases/download/v2.11.7/caddy_2.11.7_linux_amd64.tar.gz --output "$RUNNER_TEMP/caddy.tar.gz"
          echo "727b91701a392de6ebc5027509f548bf39979e5216340d0faed8fa5e69c84f8b  $RUNNER_TEMP/caddy.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/caddy"
          tar -xzf "$RUNNER_TEMP/caddy.tar.gz" -C "$RUNNER_TEMP/caddy"
          export CADDY_BINARY="$RUNNER_TEMP/caddy/caddy"
          python scripts/e2e.py dist/*.whl
          python scripts/e2e.py dist/*.whl --https --mcp
      - name: Attach distributions to GitHub Release
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        # Release assets are immutable here. Never overwrite an already attached artifact.
        run: gh release upload "$RELEASE_TAG" dist/*.whl dist/*.tar.gz dist/SHA256SUMS
  publish:
    needs: [checks, release]
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      needs.checks.result == 'success' && vars.PYPI_PUBLISH == 'true' &&
      (needs.release.outputs.created == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '' &&
      needs.release.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/oauth21-asgi/
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag || inputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Check publication metadata
        run: python scripts/publication_gate.py
      - name: Download validated release distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "$RELEASE_TAG" --dir dist --pattern '*.whl' --pattern '*.tar.gz' --pattern SHA256SUMS
          (cd dist && sha256sum --check SHA256SUMS)
          python scripts/check_distribution.py dist
          rm dist/SHA256SUMS
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          attestations: true
