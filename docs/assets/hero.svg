<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="340" viewBox="0 0 1120 340" role="img" aria-labelledby="title desc">
  <title id="title">oauth21-asgi</title>
  <desc id="desc">OAuth authorization that fits your ASGI app. Authlib, PKCE S256, CIMD and resource-bound tokens.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#101d35"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  </defs>
  <rect width="1120" height="340" rx="24" fill="url(#background)"/>
  <circle cx="1040" cy="30" r="190" fill="#38bdf8" opacity=".04"/>
  <circle cx="970" cy="300" r="180" fill="#a78bfa" opacity=".06"/>
  <path d="M48 56h42" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="48" y="104" fill="#94a3b8" font-size="14" letter-spacing="3">AUTHORIZATION · BUILT INTO YOUR APP</text>
    <text x="46" y="173" fill="#f8fafc" font-size="62" font-weight="750" letter-spacing="-2">oauth21-asgi</text>
    <text x="48" y="218" fill="#cbd5e1" font-size="24">OAuth that fits your ASGI app.</text>
    <rect x="48" y="258" width="120" height="34" rx="17" fill="#152e45"/>
    <text x="108" y="280" fill="#7dd3fc" font-size="13" text-anchor="middle">PKCE S256</text>
    <rect x="180" y="258" width="126" height="34" rx="17" fill="#232445"/>
    <text x="243" y="280" fill="#c4b5fd" font-size="13" text-anchor="middle">CIMD + DCR</text>
    <rect x="318" y="258" width="174" height="34" rx="17" fill="#183332"/>
    <text x="405" y="280" fill="#99f6e4" font-size="13" text-anchor="middle">Resource-bound tokens</text>
    <rect x="686" y="77" width="370" height="188" rx="16" fill="#0d1729" stroke="#334155"/>
    <circle cx="709" cy="99" r="4" fill="#38bdf8"/>
    <circle cx="723" cy="99" r="4" fill="#a78bfa"/>
    <circle cx="737" cy="99" r="4" fill="#5eead4"/>
    <text x="712" y="144" fill="#94a3b8" font-size="15">YOUR HOST</text>
    <text x="712" y="174" fill="#e2e8f0" font-size="20">Identity · Consent · Storage</text>
    <path d="M712 195h315" stroke="#334155"/>
    <text x="712" y="226" fill="#7dd3fc" font-size="17">Authlib handles the protocol.</text>
  </g>
</svg>
